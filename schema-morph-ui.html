<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchemaMorph AI Prototype</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #0B0F19;
      --bg-panel: #121826;
      --bg-card: #1A2233;
      
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-caption: #94A3B8;
      
      --color-indigo: #6366F1;
      --color-teal: #14B8A6;
      --color-amber: #F59E0B;
      --color-pink: #EC4899;
      
      font-family: 'Inter', sans-serif;
    }
    
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    .aurora-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; overflow: hidden; pointer-events: none;
    }
    .blob { position: absolute; filter: blur(100px); border-radius: 50%; opacity: 0.2; }
    .blob-1 { background: #6366F1; width: 400px; height: 400px; top: -100px; left: -100px; }
    .blob-2 { background: #EC4899; width: 300px; height: 300px; top: 20%; right: -50px; }
    .blob-3 { background: #14B8A6; width: 500px; height: 500px; bottom: -150px; left: 30%; }
    
    .focus-ring:focus-visible { outline: 2px solid #FDE68A; outline-offset: 2px; }
    
    .brand-gradient { background: linear-gradient(135deg, #4F46E5, #7C3AED, #C026D3); }
    .brand-text {
      background: linear-gradient(135deg, #4F46E5, #7C3AED, #C026D3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .info-gradient { background: linear-gradient(135deg, #06B6D4, #3B82F6); }
    
    .card { background-color: var(--bg-card); border: 1px solid #334155; border-radius: 12px; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.1); }
    .card-top-grad {
      border-top: 2px solid transparent;
      background-image: linear-gradient(var(--bg-card), var(--bg-card)), linear-gradient(90deg, #06B6D4, #3B82F6);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }
    
    .nav-item { transition: all 0.15s; }
    .nav-item.active { background-color: rgba(99,102,241,0.1); border-left: 3px solid #6366F1; }
    .nav-item:hover:not(.active) { background-color: rgba(255,255,255,0.05); }
    
    .graph-node {
      background-color: #0B0F19;
      border: 1px solid currentColor;
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="aurora-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, size = 20, color = "currentColor", className = "" }) => {
      useEffect(() => {
        lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} width={size} height={size} stroke={color} className={`lucide ${className}`}></i>;
    };

    const App = () => {
      const [screen, setScreen] = useState('landing');
      
      const navigate = (newScreen) => setScreen(newScreen);

      return (
        <div className="min-h-screen flex text-[#F8FAFC]">
          {screen !== 'landing' && screen !== 'progress' && (
            <Sidebar current={screen} onNav={navigate} />
          )}
          <main className="flex-1 flex flex-col h-screen overflow-hidden">
            <div className="flex-1 overflow-y-auto p-8">
              {screen === 'landing' && <Landing onNext={() => navigate('progress')} />}
              {screen === 'progress' && <Progress onNext={() => navigate('dashboard')} />}
              {screen === 'dashboard' && <Dashboard />}
              {screen === 'recommendations' && <Recommendations />}
              {screen === 'migration' && <Migration />}
              {screen === 'compare' && <Compare />}
            </div>
          </main>
        </div>
      );
    };

    const Sidebar = ({ current, onNav }) => (
      <div className="w-64 bg-[#121826] border-r border-[#334155] flex flex-col">
        <div className="p-6 flex items-center gap-3">
          <div className="w-8 h-8 rounded-lg brand-gradient flex items-center justify-center">
            <Icon name="network" size={18} color="white" />
          </div>
          <span className="font-bold text-lg tracking-tight">SchemaMorph</span>
        </div>
        <nav className="flex-1 px-3 py-4 space-y-1">
          {[
            { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
            { id: 'recommendations', icon: 'lightbulb', label: 'Recommendations' },
            { id: 'migration', icon: 'list-todo', label: 'Migration Plan' },
            { id: 'compare', icon: 'split-square-horizontal', label: 'Compare' },
          ].map(item => (
            <button
              key={item.id}
              onClick={() => onNav(item.id)}
              className={`nav-item w-full flex items-center gap-3 px-4 py-3 rounded-md focus-ring text-[15px] font-medium ${current === item.id ? 'active text-[#F8FAFC]' : 'text-[#CBD5E1] border-l-[3px] border-transparent'}`}
            >
              <Icon name={item.icon} size={18} color={current === item.id ? '#6366F1' : '#94A3B8'} />
              {item.label}
            </button>
          ))}
        </nav>
        <div className="p-4 border-t border-[#334155]">
          <button className="flex items-center gap-3 text-[#94A3B8] hover:text-[#F8FAFC] px-4 py-2 text-[14px]">
            <Icon name="settings" size={16} /> Settings
          </button>
        </div>
      </div>
    );

    const Landing = ({ onNext }) => (
      <div className="max-w-5xl mx-auto pt-20 flex flex-col items-center">
        <div className="mb-8 p-3 rounded-2xl bg-[#1A2233]/50 border border-[#334155] inline-flex items-center gap-3 backdrop-blur-md">
          <span className="px-2 py-1 rounded text-xs font-semibold uppercase tracking-wider bg-[#34D399]/20 text-[#34D399]">v2.0 Live</span>
          <span className="text-sm font-medium text-[#CBD5E1]">Gemini 1.5 powered clustering</span>
        </div>
        <h1 className="text-5xl md:text-7xl font-bold text-center mb-6 tracking-tight">
          Decompose your Monolith <br/> with <span className="brand-text">AI Precision.</span>
        </h1>
        <p className="text-[#CBD5E1] text-lg md:text-xl text-center max-w-2xl mb-12">
          SchemaMorph AI analyzes your PostgreSQL database graph to recommend natural microservice boundaries. Read-only. We never modify your data.
        </p>
        
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
          <div className="card p-6 flex flex-col card-top-grad group cursor-pointer focus-ring" tabIndex="0">
            <div className="w-12 h-12 rounded-lg bg-[#38BDF8]/10 flex items-center justify-center mb-4">
              <Icon name="link-2" size={24} color="#38BDF8" />
            </div>
            <h3 className="text-lg font-semibold text-[#F8FAFC] mb-2">Connect Database</h3>
            <p className="text-[#94A3B8] text-[14px] mb-6 flex-1">Provide a read-only connection string for live graph analysis.</p>
            <input type="text" placeholder="postgres://user:pass@host..." className="w-full bg-[#0B0F19] border border-[#334155] rounded-md px-3 py-2 text-[14px] font-mono mb-4 text-[#F8FAFC] focus:border-[#6366F1] focus:outline-none" />
            <button onClick={onNext} className="w-full brand-gradient text-white font-semibold py-2.5 rounded-md hover:opacity-90 focus-ring">Analyze DB</button>
          </div>
          
          <div className="card p-6 flex flex-col group cursor-pointer focus-ring hover:border-[#F59E0B]/50" tabIndex="0">
            <div className="w-12 h-12 rounded-lg bg-[#F59E0B]/10 flex items-center justify-center mb-4">
              <Icon name="file-code" size={24} color="#F59E0B" />
            </div>
            <h3 className="text-lg font-semibold text-[#F8FAFC] mb-2">Upload Schema</h3>
            <p className="text-[#94A3B8] text-[14px] mb-6 flex-1">Upload a .sql DDL file to analyze the schema offline.</p>
            <div className="border-2 border-dashed border-[#334155] rounded-md h-24 flex items-center justify-center mb-4 group-hover:border-[#F59E0B]/50">
              <span className="text-[14px] text-[#94A3B8]">schema.sql</span>
            </div>
            <button onClick={onNext} className="w-full bg-[#1A2233] border border-[#334155] text-[#F8FAFC] font-semibold py-2.5 rounded-md hover:bg-[#334155] focus-ring">Upload File</button>
          </div>

          <div className="card p-6 flex flex-col group cursor-pointer focus-ring hover:border-[#14B8A6]/50" tabIndex="0">
            <div className="w-12 h-12 rounded-lg bg-[#14B8A6]/10 flex items-center justify-center mb-4">
              <Icon name="database" size={24} color="#14B8A6" />
            </div>
            <h3 className="text-lg font-semibold text-[#F8FAFC] mb-2">Try Sample</h3>
            <p className="text-[#94A3B8] text-[14px] mb-6 flex-1">Load the e-commerce demo dataset to explore the dashboard.</p>
            <div className="bg-[#0B0F19] rounded-md p-3 mb-4">
              <div className="text-xs text-[#94A3B8] font-mono">14 tables • 23 relations</div>
              <div className="text-xs text-[#94A3B8] font-mono">Orders, Users, Inventory...</div>
            </div>
            <button onClick={onNext} className="w-full bg-[#1A2233] border border-[#334155] text-[#F8FAFC] font-semibold py-2.5 rounded-md hover:bg-[#334155] focus-ring">Load E-Commerce DB</button>
          </div>
        </div>
      </div>
    );

    const Progress = ({ onNext }) => {
      const [step, setStep] = useState(0);
      const steps = [
        { label: 'Parsing DDL', color: '#38BDF8', icon: 'file-text' },
        { label: 'Building Dependency Graph', color: '#F59E0B', icon: 'share-2' },
        { label: 'Louvain Clustering', color: '#EC4899', icon: 'git-merge' },
        { label: 'AI Boundary Analysis', color: '#6366F1', icon: 'cpu' }
      ];

      useEffect(() => {
        const timer = setInterval(() => {
          setStep(s => {
            if (s >= steps.length) {
              clearInterval(timer);
              setTimeout(onNext, 1000);
              return s;
            }
            return s + 1;
          });
        }, 1500);
        return () => clearInterval(timer);
      }, []);

      return (
        <div className="max-w-3xl mx-auto pt-24">
          <h2 className="text-3xl font-bold mb-12 text-center">Analyzing Monolith...</h2>
          
          <div className="flex justify-between mb-12 relative">
            <div className="absolute top-5 left-0 w-full h-0.5 bg-[#334155] -z-10"></div>
            <div className="absolute top-5 left-0 h-0.5 brand-gradient transition-all duration-500 -z-10" style={{ width: `${(Math.min(step, 3) / 3) * 100}%` }}></div>
            
            {steps.map((s, i) => (
              <div key={i} className="flex flex-col items-center gap-3">
                <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors duration-500 ${i < step ? 'bg-[#34D399] text-[#0B0F19]' : i === step ? 'bg-[#1A2233] border-2 border-[#6366F1] text-[#6366F1]' : 'bg-[#1A2233] border border-[#334155] text-[#94A3B8]'}`}>
                  <Icon name={i < step ? 'check' : s.icon} size={20} />
                </div>
                <span className={`text-[14px] font-medium ${i <= step ? 'text-[#F8FAFC]' : 'text-[#94A3B8]'}`}>{s.label}</span>
              </div>
            ))}
          </div>

          <div className="card bg-[#0B0F19] p-4 font-mono text-[13px] text-[#94A3B8] h-64 overflow-y-auto">
            <div className={step >= 0 ? 'opacity-100' : 'opacity-0'}>[10:14:01] INFO - Parsing postgres schema... found 14 tables.</div>
            <div className={step >= 1 ? 'opacity-100 mt-2' : 'opacity-0 mt-2'}>[10:14:02] INFO - Building edges... extracted 23 foreign keys.</div>
            <div className={step >= 2 ? 'opacity-100 mt-2' : 'opacity-0 mt-2'}>[10:14:04] INFO - Running Louvain... detected 4 modular communities (modularity: 0.62).</div>
            <div className={step >= 3 ? 'opacity-100 mt-2 text-[#F59E0B]' : 'opacity-0 mt-2'}>[10:14:06] AI - Gemini processing boundaries... generating semantic names.</div>
            {step >= 4 && <div className="text-[#34D399] mt-2">[10:14:08] SUCCESS - Analysis complete. Redirecting...</div>}
          </div>
        </div>
      );
    };

    const Dashboard = () => (
      <div className="max-w-6xl mx-auto h-full flex flex-col">
        <div className="flex justify-between items-center mb-6">
          <h1 className="text-2xl font-bold">Architecture Dashboard</h1>
          <div className="flex items-center gap-4">
            <span className="flex items-center gap-2 text-[14px] bg-[#121826] px-3 py-1.5 rounded-full border border-[#334155]">
              <span className="w-2 h-2 rounded-full bg-[#F59E0B]"></span> E-Commerce Monolith
            </span>
            <button className="bg-[#1A2233] border border-[#334155] px-4 py-1.5 rounded-md text-[14px] font-medium hover:bg-[#334155] focus-ring">Export</button>
          </div>
        </div>

        <div className="grid grid-cols-4 gap-4 mb-6">
          {[
            { label: 'Total Tables', value: '14', icon: 'table', color: 'text-[#38BDF8]', bg: 'bg-[#38BDF8]/10' },
            { label: 'Foreign Keys', value: '23', icon: 'link', color: 'text-[#F59E0B]', bg: 'bg-[#F59E0B]/10' },
            { label: 'Suggested Services', value: '4', icon: 'box', color: 'text-[#EC4899]', bg: 'bg-[#EC4899]/10' },
            { label: 'Coupling Score', value: '62/100', icon: 'activity', color: 'text-[#34D399]', bg: 'bg-[#34D399]/10' }
          ].map((s, i) => (
            <div key={i} className="card p-4 flex items-center gap-4">
              <div className={`w-12 h-12 rounded-lg ${s.bg} flex items-center justify-center`}>
                <Icon name={s.icon} size={24} className={s.color} />
              </div>
              <div>
                <div className="text-[#94A3B8] text-[13px] font-medium">{s.label}</div>
                <div className="text-2xl font-bold text-[#F8FAFC]">{s.value}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="flex-1 flex gap-6 min-h-0">
          <div className="flex-1 card p-1 relative overflow-hidden flex flex-col">
            <div className="absolute top-4 left-4 z-10 flex gap-2 bg-[#121826] p-1 border border-[#334155] rounded-md shadow-lg">
              <button className="px-3 py-1 text-[13px] font-medium bg-[#334155] text-[#F8FAFC] rounded">Color by Service</button>
              <button className="px-3 py-1 text-[13px] font-medium text-[#94A3B8] hover:text-[#F8FAFC] rounded">Color by Coupling</button>
            </div>
            
            {/* Mock Graph Representation */}
            <div className="flex-1 bg-[#0B0F19] rounded-lg relative inset-0 pattern-dots border border-[#334155]">
              {/* Edges */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none stroke-[#334155] stroke-2">
                <path d="M 250 150 Q 350 180 450 150" fill="transparent" />
                <path d="M 450 150 Q 550 200 600 300" fill="transparent" />
                <path d="M 250 350 Q 350 330 450 350" fill="transparent" />
              </svg>
              
              {/* Nodes */}
              <div className="absolute top-[130px] left-[150px] graph-node" style={{color: 'var(--color-indigo)'}}>
                <Icon name="users" size={14}/> users
              </div>
              <div className="absolute top-[160px] left-[200px] graph-node" style={{color: 'var(--color-indigo)'}}>
                <Icon name="table" size={14}/> user_profiles
              </div>
              
              <div className="absolute top-[130px] left-[450px] graph-node" style={{color: 'var(--color-amber)'}}>
                <Icon name="shopping-cart" size={14}/> orders
              </div>
              <div className="absolute top-[180px] left-[480px] graph-node" style={{color: 'var(--color-amber)'}}>
                <Icon name="table" size={14}/> order_items
              </div>
              
              <div className="absolute top-[280px] left-[600px] graph-node" style={{color: 'var(--color-pink)'}}>
                <Icon name="package" size={14}/> products
              </div>
              <div className="absolute top-[340px] left-[550px] graph-node" style={{color: 'var(--color-pink)'}}>
                <Icon name="tag" size={14}/> categories
              </div>
            </div>

            {/* Legend */}
            <div className="absolute bottom-4 left-4 z-10 bg-[#121826] border border-[#334155] rounded-md p-3 shadow-lg flex gap-4">
              <div className="flex items-center gap-2 text-[13px]"><span className="w-3 h-3 rounded-full bg-[#6366F1]"></span> User Service</div>
              <div className="flex items-center gap-2 text-[13px]"><span className="w-3 h-3 rounded-full bg-[#F59E0B]"></span> Order Service</div>
              <div className="flex items-center gap-2 text-[13px]"><span className="w-3 h-3 rounded-full bg-[#EC4899]"></span> Catalog Service</div>
              <div className="flex items-center gap-2 text-[13px]"><span className="w-3 h-3 rounded-full bg-[#14B8A6]"></span> Fulfillment</div>
            </div>
          </div>

          <div className="w-80 flex flex-col gap-4">
            <div className="card flex-1 p-5 flex flex-col">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-3 h-8 rounded-full bg-[#F59E0B]"></div>
                <div>
                  <h3 className="font-bold text-lg">Order Service</h3>
                  <div className="text-[13px] text-[#94A3B8]">4 Tables • High Confidence</div>
                </div>
              </div>
              <p className="text-[14px] text-[#CBD5E1] mb-6">Core domain handling customer orders, line items, and payment status tracking.</p>
              
              <h4 className="text-[13px] font-semibold text-[#94A3B8] uppercase tracking-wider mb-3">Tables</h4>
              <div className="space-y-2 mb-6">
                <div className="bg-[#121826] px-3 py-2 rounded border border-[#334155] font-mono text-[13px]">orders</div>
                <div className="bg-[#121826] px-3 py-2 rounded border border-[#334155] font-mono text-[13px]">order_items</div>
                <div className="bg-[#121826] px-3 py-2 rounded border border-[#334155] font-mono text-[13px]">payments</div>
                <div className="bg-[#121826] px-3 py-2 rounded border border-[#334155] font-mono text-[13px]">invoices</div>
              </div>

              <h4 className="text-[13px] font-semibold text-[#94A3B8] uppercase tracking-wider mb-3">External FKs</h4>
              <div className="flex items-center gap-2 text-[13px] bg-[#F87171]/10 text-[#F87171] px-3 py-2 rounded-md border border-[#F87171]/20">
                <Icon name="alert-circle" size={16} /> orders.user_id → users.id
              </div>
            </div>
          </div>
        </div>
      </div>
    );

    const Recommendations = () => (
      <div className="max-w-5xl mx-auto">
        <h1 className="text-2xl font-bold mb-2">Service Boundaries</h1>
        <p className="text-[#94A3B8] mb-8">AI-recommended microservices based on your monolithic graph topology.</p>

        <div className="space-y-6">
          {/* User Service */}
          <div className="card overflow-hidden">
            <div className="h-1 bg-[#6366F1]"></div>
            <div className="p-6">
              <div className="flex justify-between items-start mb-4">
                <div className="flex items-center gap-3">
                  <div className="bg-[#6366F1]/20 p-2 rounded-md"><Icon name="users" className="text-[#6366F1]" size={20}/></div>
                  <h3 className="text-xl font-bold">User Service</h3>
                </div>
                <div className="bg-[#34D399]/10 border border-[#34D399]/20 text-[#34D399] px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5">
                  <Icon name="shield-check" size={14}/> High Confidence
                </div>
              </div>
              <p className="text-[#CBD5E1] text-[15px] mb-6">Highly cohesive cluster managing authentication, profiles, and preferences. Minimal outbound foreign keys.</p>
              
              <div className="flex gap-2 flex-wrap mb-6">
                <span className="px-3 py-1 bg-[#121826] border border-[#334155] rounded-full text-[13px] font-mono">users</span>
                <span className="px-3 py-1 bg-[#121826] border border-[#334155] rounded-full text-[13px] font-mono">user_profiles</span>
                <span className="px-3 py-1 bg-[#121826] border border-[#334155] rounded-full text-[13px] font-mono">sessions</span>
              </div>

              <div className="bg-[#121826] border border-[#334155] rounded-lg overflow-hidden">
                <table className="w-full text-left text-[14px]">
                  <thead className="bg-[#1A2233] border-b border-[#334155]">
                    <tr><th className="px-4 py-3 font-semibold text-[#94A3B8]">Dependency</th><th className="px-4 py-3 font-semibold text-[#94A3B8]">Fix Strategy</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="px-4 py-3 font-mono text-[#CBD5E1] border-b border-[#334155]">orders.user_id → users.id</td>
                      <td className="px-4 py-3 border-b border-[#334155]">
                        <span className="inline-flex px-2 py-1 rounded bg-[#38BDF8]/10 text-[#38BDF8] border border-[#38BDF8]/20 text-[12px] font-semibold">API Gateway Validation</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* Catalog Service */}
          <div className="card overflow-hidden">
            <div className="h-1 bg-[#EC4899]"></div>
            <div className="p-6">
              <div className="flex justify-between items-start mb-4">
                <div className="flex items-center gap-3">
                  <div className="bg-[#EC4899]/20 p-2 rounded-md"><Icon name="box" className="text-[#EC4899]" size={20}/></div>
                  <h3 className="text-xl font-bold">Catalog Service</h3>
                </div>
                <div className="bg-[#F59E0B]/10 border border-[#F59E0B]/20 text-[#F59E0B] px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5">
                  <Icon name="alert-circle" size={14}/> Medium Confidence
                </div>
              </div>
              <p className="text-[#CBD5E1] text-[15px] mb-6">Manages product definitions and categories. Tightly coupled with Inventory, consider merging if read latency is critical.</p>
              
              <div className="flex gap-2 flex-wrap mb-6">
                <span className="px-3 py-1 bg-[#121826] border border-[#334155] rounded-full text-[13px] font-mono">products</span>
                <span className="px-3 py-1 bg-[#121826] border border-[#334155] rounded-full text-[13px] font-mono">categories</span>
                <span className="px-3 py-1 bg-[#121826] border border-[#334155] rounded-full text-[13px] font-mono">product_tags</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    );

    const Migration = () => (
      <div className="max-w-4xl mx-auto">
        <div className="flex justify-between items-center mb-8">
          <div>
            <h1 className="text-2xl font-bold mb-2">Migration Plan</h1>
            <p className="text-[#94A3B8]">Step-by-step roadmap to extract services without downtime.</p>
          </div>
          <button className="bg-[#1A2233] border border-[#334155] px-4 py-2 rounded-md text-[14px] font-medium hover:bg-[#334155] focus-ring flex items-center gap-2">
            <Icon name="download" size={16}/> Export Markdown
          </button>
        </div>

        <div className="relative border-l-2 border-[#334155] pl-8 space-y-10 ml-4">
          <div className="relative">
            <div className="absolute -left-[41px] top-1 w-5 h-5 rounded-full bg-[#6366F1] border-4 border-[#0B0F19]"></div>
            <h3 className="text-lg font-bold mb-2">Phase 1: Extract User Service</h3>
            <div className="flex gap-2 mb-4">
              <span className="text-xs px-2 py-1 bg-[#121826] border border-[#334155] text-[#CBD5E1] rounded">Effort: Low</span>
              <span className="text-xs px-2 py-1 bg-[#34D399]/10 border border-[#34D399]/20 text-[#34D399] rounded">Risk: Minimal</span>
            </div>
            <div className="card p-4 space-y-3">
              <label className="flex items-start gap-3 cursor-pointer">
                <input type="checkbox" className="mt-1 w-4 h-4 rounded border-[#334155] bg-[#0B0F19] text-[#6366F1] focus:ring-0 focus-ring" />
                <span className="text-[14px] text-[#CBD5E1]">Drop `orders.user_id` foreign key constraint. Replace with application-level validation.</span>
              </label>
              <div className="bg-[#0B0F19] p-3 rounded-md border border-[#334155] font-mono text-[12px] text-[#94A3B8] relative">
                ALTER TABLE orders DROP CONSTRAINT orders_user_id_fkey;
                <button className="absolute top-2 right-2 text-[#94A3B8] hover:text-[#F8FAFC]"><Icon name="copy" size={14}/></button>
              </div>
            </div>
          </div>

          <div className="relative">
            <div className="absolute -left-[41px] top-1 w-5 h-5 rounded-full bg-[#F59E0B] border-4 border-[#0B0F19]"></div>
            <h3 className="text-lg font-bold mb-2">Phase 2: Isolate Orders & Payments</h3>
            <div className="flex gap-2 mb-4">
              <span className="text-xs px-2 py-1 bg-[#121826] border border-[#334155] text-[#CBD5E1] rounded">Effort: High</span>
              <span className="text-xs px-2 py-1 bg-[#F87171]/10 border border-[#F87171]/20 text-[#F87171] rounded">Risk: High</span>
            </div>
            <div className="card p-4 space-y-3">
              <label className="flex items-start gap-3 cursor-pointer">
                <input type="checkbox" className="mt-1 w-4 h-4 rounded border-[#334155] bg-[#0B0F19] text-[#F59E0B] focus:ring-0 focus-ring" />
                <span className="text-[14px] text-[#CBD5E1]">Implement event-driven eventual consistency for `inventory` updates when `orders` are placed.</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    );

    const Compare = () => (
      <div className="max-w-6xl mx-auto h-full flex flex-col">
        <h1 className="text-2xl font-bold mb-2">Compare Architecture</h1>
        <p className="text-[#94A3B8] mb-8">Visual diff of current monolithic schema vs proposed microservices.</p>

        <div className="flex-1 grid grid-cols-2 gap-8">
          <div className="flex flex-col">
            <div className="bg-[#121826] p-3 rounded-t-lg border border-[#334155] border-b-0 font-semibold text-center text-[#F87171]">Current Monolith</div>
            <div className="card flex-1 p-6 rounded-t-none border-t-0 space-y-2">
              {['users', 'user_profiles', 'orders', 'order_items', 'products', 'categories', 'inventory'].map(t => (
                <div key={t} className="bg-[#0B0F19] border border-[#334155] p-3 rounded font-mono text-[14px]">{t}</div>
              ))}
            </div>
          </div>

          <div className="flex flex-col">
            <div className="bg-[#121826] p-3 rounded-t-lg border border-[#334155] border-b-0 font-semibold text-center text-[#34D399]">Proposed Services</div>
            <div className="card flex-1 p-6 rounded-t-none border-t-0 space-y-6">
              
              <div className="border border-[#6366F1]/30 rounded-lg p-4 bg-[#6366F1]/5">
                <h4 className="text-[14px] font-bold text-[#6366F1] mb-3 uppercase tracking-wider">User Service</h4>
                <div className="space-y-2">
                  <div className="bg-[#0B0F19] border border-[#6366F1]/50 p-2 rounded font-mono text-[13px]">users</div>
                  <div className="bg-[#0B0F19] border border-[#6366F1]/50 p-2 rounded font-mono text-[13px]">user_profiles</div>
                </div>
              </div>

              <div className="border border-[#F59E0B]/30 rounded-lg p-4 bg-[#F59E0B]/5">
                <h4 className="text-[14px] font-bold text-[#F59E0B] mb-3 uppercase tracking-wider">Order Service</h4>
                <div className="space-y-2">
                  <div className="bg-[#0B0F19] border border-[#F59E0B]/50 p-2 rounded font-mono text-[13px]">orders</div>
                  <div className="bg-[#0B0F19] border border-[#F59E0B]/50 p-2 rounded font-mono text-[13px]">order_items</div>
                </div>
              </div>

              <div className="border border-[#EC4899]/30 rounded-lg p-4 bg-[#EC4899]/5">
                <h4 className="text-[14px] font-bold text-[#EC4899] mb-3 uppercase tracking-wider">Catalog Service</h4>
                <div className="space-y-2">
                  <div className="bg-[#0B0F19] border border-[#EC4899]/50 p-2 rounded font-mono text-[13px]">products</div>
                  <div className="bg-[#0B0F19] border border-[#EC4899]/50 p-2 rounded font-mono text-[13px]">categories</div>
                  <div className="bg-[#0B0F19] border border-[#EC4899]/50 p-2 rounded font-mono text-[13px]">inventory</div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
