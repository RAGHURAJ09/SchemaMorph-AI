server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React SPA — all non-API routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/ calls to the backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow longer timeouts for the AI analysis endpoint (up to 60s)
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy /docs and /redoc for API documentation access
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Gzip responses for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
