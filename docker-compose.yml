version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: schemamorph_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: schemamorph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - schemamorph_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schemamorph_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/schemamorph
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schemamorph_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schemamorph_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - schemamorph_net

volumes:
  postgres_data:
    driver: local

networks:
  schemamorph_net:
    driver: bridge
