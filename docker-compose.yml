version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schemamorph_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      - APP_ENV=${APP_ENV:-production}
    networks:
      - schemamorph_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schemamorph_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - schemamorph_net

networks:
  schemamorph_net:
    driver: bridge
